<script>
var D; // populated by _initDashData() after Okta auth + AES-GCM decrypt

var PALETTE = [
  '#3B82F6','#8B5CF6','#06B6D4','#F59E0B','#10B981',
  '#EC4899','#EF4444','#84CC16','#F97316','#6366F1',
  '#14B8A6','#A78
BFA','#FB7185'
];
function pColor(i){return PALETTE[i % PALETTE.length];}
var pColorMap = {};
var activeProduct = null, showInterns = false;
var donutChart, barChart;

function _initDashData(data) {
  D = data;
  pColorMap = {};
  D.productBreakdown.forEach(function(p, i){ pColorMap[p.product] = i; });

document.getElementById('lastUpdated').textContent = 'Last updated: ' + D.lastUpdated;
document.getElementById('donutCenter').textContent = D.totalSL;

var statsData = [
  {icon:'ð±ð°', value:D.totalSL, label:'Sri Lanka Headcount', sub:'active employees'},
  {icon:'ð', value:D.slPctOfAll + '%', label:'of Global Team', sub:'(' + D.totalAll + ' total active globally)'},
  {icon:'ð', value:D.internCount, label:'Current Interns', sub:'of ' + D.totalSL + ' LK total'},
];
document.getElementById('statsRow').innerHTML = statsData.map(function(s){
  return '<div class="stat-card">'
    + '<div class="stat-icon">' + s.icon + '</div>'
    + '<div class="stat-value">' + s.value + '</div>'
    + '<div class="stat-label">' + s.label + '</div>'
    + '<div class="stat-sub">'  + s.sub   + '</div>'
    + '</div>';
}).join('');

donutChart = new Chart(document.getElementById('donutChart'), {
  type: 'doughnut',
  data: {
    labels: D.productBreakdown.map(function(p){ return p.product; }),
    datasets:[{
      data: D.productBreakdown.map(function(p){ return p.slCount; }),
      backgroundColor: D.productBreakdown.map(function(p,i){ return pColor(i); }),
      borderWidth: 2, borderColor: '#fff', hoverOffset: 8
    }]
  },
  options: {
    cutout: '62%',
    plugins: {
      legend: {display: false},
      tooltip: {callbacks:{label:function(ctx){
        return ' ' + ctx.label + ': ' + ctx.parsed + ' (' + Math.round(ctx.parsed / D.totalSL * 100) + '%)';
      }}}
    },
    animation: {duration:600}
  }
});

document.getElementById('donutLegend').innerHTML = D.productBreakdown.map(function(p,i){
  return '<div class="legend-item" onclick="activateChip(\'' + p.product.replace(/'/g,"\\'") + '\')">'
    + '<span class="legend-dot" style="background:' + pColor(i) + '"></span>'
    + '<span class="legend-name">' + p.product + '</span>'
    + '<span class="legend-cnt">' + p.slCount + '</span>'
    + '<span class="legend-pct">' + p.ofSLPct + '%</span>'
    + '</div>';
}).join('');

var stackSorted = D.productBreakdown.slice().sort(function(a,b){ return b.slPct - a.slPct; });
barChart = new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
    labels: stackSorted.map(function(p){ return p.product; }),
    datasets: [
      {
        label: 'Sri Lanka',
        data: stackSorted.map(function(p){ return p.slPct; }),
        backgroundColor: stackSorted.map(function(p){ return pColor(pColorMap[p.product]); }),
        borderWidth: 0
      },
      {
        label: 'Others',
        data: stackSorted.map(function(p){ return 100 - p.slPct; }),
        backgroundColor: '#CBD5E1',
        borderWidth: 0
      }
    ]
  },
  options: {
    indexAxis: 'y',
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: {position:'bottom', labels:{font:{size:11}, boxWidth:12}},
      tooltip: {callbacks:{label:function(ctx){
        var p = stackSorted[ctx.dataIndex];
        if(ctx.datasetIndex === 0){
          return ' Sri Lanka: ' + p.slCount + ' / ' + p.totalCount + ' (' + p.slPct + '%)';
        } else {
          return ' Others: ' + (p.totalCount - p.slCount) + ' / ' + p.totalCount + ' (' + (100 - p.slPct) + '%)';
        }
      }}}
    },
    scales: {
      x: {stacked:true, min:0, max:100, grid:{color:'#F1F5F9'},
          ticks:{callback:function(v){return v+'%';}, font:{size:10}}},
      y: {stacked:true, grid:{display:false}, ticks:{font:{size:10}}}
    },
    animation: {duration:600}
  }
});


var chips = document.getElementById('productChips');
chips.innerHTML = D.productBreakdown.map(function(p){
  return '<span class="chip" data-product="' + p.product + '" onclick="toggleChip(this)">' + p.product + '</span>';
}).join('');

document.getElementById('internChip').innerHTML =
  '<span class="chip intern-chip" id="internChipEl" onclick="toggleIntern(this)">ð Interns only</span>';

function toggleChip(el) {
  var prod = el.getAttribute('data-product');
  document.querySelectorAll('.chip:not(.intern-chip)').forEach(function(c){ c.classList.remove('active'); });
  if(activeProduct === prod){ activeProduct = null; }
  else { activeProduct = prod; el.classList.add('active'); }
  renderTable();
}
function activateChip(prod) {
  document.querySelectorAll('.chip:not(.intern-chip)').forEach(function(c){
    c.classList.toggle('active', c.getAttribute('data-product') === prod);
  });
  activeProduct = (activeProduct === prod) ? null : prod;
  renderTable();
}
function toggleIntern(el) {
  showInterns = !showInterns;
  el.classList.toggle('active', showInterns);
  renderTable();
}

function renderTable() {
  if (!D) return;
  var q = document.getElementById('searchInput').value.toLowerCase().trim();
  var rows = D.employees.filter(function(e){
    var matchSearch = !q
      || e.name.toLowerCase().includes(q)
      || e.product.toLowerCase().includes(q)
      || e.jobTitle.toLowerCase().includes(q)
      || e.manager.toLowerCase().includes(q)
      || e.department.toLowerCase().includes(q);
    var matchProduct = !activeProduct || e.product === activeProduct;
    var matchIntern  = !showInterns  || e.isIntern;
    return matchSearch && matchProduct && matchIntern;
  });

  var tbody = document.getElementById('tableBody');
  var noRes = document.getElementById('noResults');
  var count = document.getElementById('resultCount');

  count.textContent = rows.length + ' of ' + D.employees.length + ' members';

  if(rows.length === 0){
    tbody.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  tbody.innerHTML = rows.map(function(e){
    var ci = pColorMap[e.product] !== undefined ? pColorMap[e.product] : 0;
    var col = pColor(ci);
    var badge = '<span class="product-badge" style="background:' + col + '22;color:' + col + '">' + e.product + '</span>';
    var intern = e.isIntern ? '<span class="intern-badge">INTERN</span>' : '';
    var tenure = e.tenure < 0.1 ? '< 1 mo' : (e.tenure < 1 ? Math.round(e.tenure * 12) + ' mo' : e.tenure.toFixed(1) + ' yr');
    return '<tr>'
      + '<td class="name-cell">' + e.name + intern + '</td>'
      + '<td>' + badge + '</td>'
      + '<td class="job-title">' + e.jobTitle + '</td>'
      + '<td class="muted">' + e.manager + '</td>'
      + '<td class="muted">' + e.department + '</td>'
      + '<td class="tenure">' + tenure + '</td>'
      + '<td class="muted">' + e.firstDay + '</td>'
      + '</tr>';
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', renderTable);
  renderTable();
} // end _initDashData

function openTests(){ document.getElementById('testPanel').classList.add('open'); }
function closeTests(){ document.getElementById('testPanel').classList.remove('open'); }

function runAllTests(){
  if (!D) { alert('Dashboard data not yet loaded.'); return; }
  var out = document.getElementById('testOutput');
  var lines = [];
  var passed = 0, failed = 0;

  function suite(name){ lines.push('<span class="t-suite">â¶ ' + name + '</span>'); }
  function pass(msg){ lines.push('<span class="t-pass">â ' + msg + '</span>'); passed++; }
  function fail(msg){ lines.push('<span class="t-fail">â ' + msg + '</span>'); failed++; }
  function assert(cond, ok, bad){ cond ? pass(ok) : fail(bad); }

  suite('DATA INTEGRITY');
  assert(D.totalSL === 36, 'Total LK headcount = 36', 'Total LK headcount expected 36, got ' + D.totalSL);
  assert(D.totalAll === 118, 'Global headcount = 118', 'Global headcount expected 118, got ' + D.totalAll);
  assert(D.internCount === 4, 'Intern count = 4', 'Intern count expected 4, got ' + D.internCount);
  var calcInterns = D.employees.filter(function(e){ return e.isIntern; }).length;
  assert(calcInterns === 4, 'employees[] contains exactly 4 interns', 'employees[] intern count expected 4, got ' + calcInterns);
  assert(D.employees.length === 36, 'employees[] array length = 36', 'employees[] length expected 36, got ' + D.employees.length);
  assert(D.slPctOfAll === 31, 'LK % of global team = 31%', 'LK % expected 31, got ' + D.slPctOfAll);
  assert(D.productBreakdown.length === 13, 'productBreakdown has 13 products', 'productBreakdown length expected 13, got ' + D.productBreakdown.length);

  suite('PRODUCT HEADCOUNTS');
  var pbMap = {};
  D.productBreakdown.forEach(function(p){ pbMap[p.product] = p; });
  var expected = {'DevOps Infra':7,'DriverlessAI':5,'MC':4,'Platform Services':3,'Verticals':3,'h2oGPTe':3,'Documentation':3,'MLOps':2,'MC Apps':2,'HAIC Delivery':1,'Customer Training':1,'Feature Store':1,'Management':1};
  Object.keys(expected).forEach(function(prod){
    var fromBreakdown = pbMap[prod] ? pbMap[prod].slCount : 0;
    var fromEmployees = D.employees.filter(function(e){ return e.product === prod; }).length;
    assert(fromBreakdown === expected[prod], prod + ': breakdown count = ' + expected[prod], prod + ': breakdown expected ' + expected[prod] + ', got ' + fromBreakdown);
    assert(fromEmployees === expected[prod], prod + ': employees[] count = ' + expected[prod], prod + ': employees[] expected ' + expected[prod] + ', got ' + fromEmployees);
  });

  suite('NAMED EMPLOYEE SPOT-CHECKS');
  function findEmployee(name){ return D.employees.find(function(e){ return e.name === name; }); }
  var hasith = findEmployee('Hasith Perera');
  assert(!!hasith, 'Hasith Perera exists in dataset', 'Hasith Perera NOT FOUND');
  if(hasith){ assert(hasith.product === 'DevOps Infra', 'Hasith Perera â DevOps Infra', 'Hasith product wrong: ' + hasith.product); }
  var vijitha = findEmployee('Vijitha Ekanayake');
  assert(!!vijitha, 'Vijitha Ekanayake exists in dataset', 'Vijitha Ekanayake NOT FOUND');
  if(vijitha){ assert(vijitha.product === 'Verticals', 'Vijitha Ekanayake â Verticals', 'Vijitha product wrong: ' + vijitha.product); }
  var yohan = findEmployee('Yohan Trevoy Gnanapragasam');
  assert(!!yohan, 'Yohan Trevoy Gnanapragasam exists in dataset', 'Yohan NOT FOUND');
  if(yohan){
    assert(yohan.product === 'Management', 'Yohan â Management', 'Yohan product wrong: ' + yohan.product);
    assert(yohan.jobTitle === 'VP of Engineering, APAC', 'Yohan job title correct', 'Yohan job title wrong: ' + yohan.jobTitle);
  }
  ['Shashmitha Bandara','Abishanthan Sarawanaraja','Isuru Didulantha','Mamta Nallaretnam'].forEach(function(name){
    var e = findEmployee(name);
    assert(!!e && e.isIntern, name + ' is marked intern', name + ' not found or not marked intern');
  });

  suite('DOM & UI ELEMENTS');
  assert(!!document.getElementById('statsRow'), 'Stats row element exists', 'statsRow element missing');
  assert(document.getElementById('statsRow').children.length === 3, 'Three stat cards rendered', 'Expected 3 stat cards, got ' + document.getElementById('statsRow').children.length);
  assert(!!document.getElementById('searchInput'), 'Search input exists', 'searchInput missing');
  assert(!!document.getElementById('tableBody'), 'Table body exists', 'tableBody missing');
  assert(!!document.getElementById('donutChart'), 'Donut canvas exists', 'donutChart canvas missing');
  assert(!!document.getElementById('barChart'), 'Bar canvas exists', 'barChart canvas missing');
  assert(document.querySelectorAll('#productChips .chip').length === 13, 'All 13 product chips rendered', '13 chips expected, got ' + document.querySelectorAll('#productChips .chip').length);
  assert(document.querySelectorAll('#tableBody tr').length === 36, 'All 36 rows rendered', '36 rows expected, got ' + document.querySelectorAll('#tableBody tr').length);
  assert(document.querySelectorAll('.intern-badge').length === 4, '4 INTERN badges visible', '4 badges expected, got ' + document.querySelectorAll('.intern-badge').length);

  suite('CHART RENDERING');
  var chartJsLoaded = typeof Chart !== 'undefined';
  assert(chartJsLoaded, 'Chart.js loaded successfully', 'Chart.js NOT loaded');
  try {
    assert(donutChart instanceof Chart, 'Donut chart instance created', 'Donut Chart instance missing');
    assert(barChart instanceof Chart, 'Stacked bar chart instance created', 'Bar Chart instance missing');
    var donutData = donutChart.data.datasets[0].data;
    assert(donutData.length === 13, 'Donut chart has 13 data points', 'Donut data points expected 13, got ' + donutData.length);
    assert(donutData.reduce(function(a,b){return a+b;},0) === 36, 'Donut chart values sum to 36', 'Donut sum wrong');
  } catch(e) { fail('Chart assertion threw: ' + e.message); }

  suite('SEARCH & FILTER FUNCTIONALITY');
  document.getElementById('searchInput').value = 'Hasith'; renderTable();
  assert(document.querySelectorAll('#tableBody tr').length === 7, 'Search "Hasith" returns 7 rows', 'Search "Hasith" expected 7, got ' + document.querySelectorAll('#tableBody tr').length);
  document.getElementById('searchInput').value = 'Weerasinghe'; renderTable();
  assert(document.querySelectorAll('#tableBody tr').length === 1, 'Search "Weerasinghe" returns 1 row', 'Search "Weerasinghe" expected 1, got ' + document.querySelectorAll('#tableBody tr').length);
  document.getElementById('searchInput').value = 'DevOps Infra'; renderTable();
  assert(document.querySelectorAll('#tableBody tr').length === 7, 'Search "DevOps Infra" returns 7 rows', 'Expected 7, got ' + document.querySelectorAll('#tableBody tr').length);
  document.getElementById('searchInput').value = 'xyznonexistent99'; renderTable();
  assert(document.getElementById('noResults').style.display !== 'none', '"No results" shown for unknown search', '"No results" not shown');
  document.getElementById('searchInput').value = ''; renderTable();
  assert(document.querySelectorAll('#tableBody tr').length === 36, 'Clearing search restores 36 rows', 'Expected 36 after clear, got ' + document.querySelectorAll('#tableBody tr').length);
  activeProduct = 'DriverlessAI'; renderTable();
  assert(document.querySelectorAll('#tableBody tr').length === 5, 'DriverlessAI chip shows 5 rows', 'Expected 5, got ' + document.querySelectorAll('#tableBody tr').length);
  activeProduct = null; showInterns = true; renderTable();
  assert(document.querySelectorAll('#tableBody tr').length === 4, 'Intern filter shows 4 rows', 'Expected 4, got ' + document.querySelectorAll('#tableBody tr').length);
  activeProduct = null; showInterns = false;
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  renderTable();

  var total = passed + failed;
  var cls = failed === 0 ? 'all-pass' : 'has-fail';
  var icon = failed === 0 ? 'â' : 'â';
  lines.push('<div class="t-summary ' + cls + '">' + icon + ' ' + passed + ' / ' + total + ' tests passed' + (failed > 0 ? ' â ' + failed + ' failed' : ' â All good!') + '</div>');
  out.innerHTML = lines.join('<br>');
  out.scrollTop = 0;
}
</script>
